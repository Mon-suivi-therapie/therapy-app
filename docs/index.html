<body>
<header>
  <h1>Mon suivi Therapy <small>Traitement, SOPK, Fertilité &amp; Pré-Diabète</small></h1>
  <nav id="nav"></nav>
</header>
<section id="login" hidden>
  <div class="logincard">
    <h2>🌸 Mon suivi Therapy</h2>
    <p class="muted">Connexion personnelle. Tu ne la fais qu'une seule fois sur cet appareil : ensuite le site te garde connectée.</p>
    <label class="f" for="lgMail">Email</label><input id="lgMail" type="email" autocomplete="username" inputmode="email">
    <label class="f" for="lgPass">Mot de passe</label><input id="lgPass" type="password" autocomplete="current-password">
    <button class="b" id="lgBtn">Se connecter</button>
    <p id="lgErr" class="muted" role="alert"></p>
  </div>
</section>
<button id="sideBtn" aria-expanded="false" aria-controls="side">💊 Médicaments</button>
<aside id="side" aria-label="Médicaments"></aside>
<main id="main"><p class="muted">Chargement de tes données…</p></main>
<div id="toast"></div>
<script src="core.js"></script>
<script src="tab-dash.js"></script>
<script src="tab-cycle.js"></script>
<script src="tab-health.js"></script>
<script src="tab-misc.js"></script>

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
